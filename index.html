<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{
  --bg:#f7f2f4; --card:#ffffff; --ink:#1d1a1c; --muted:#85777d; --line:#eadfe4;
  --accent:#9b5c73; --accent-ink:#ffffff; --plum:#822a54; --soft:#f3e6ec; --ok:#3f8a62; --danger:#b3392f;
  --hero:#161214; --shadow:0 8px 28px rgba(60,20,40,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151113; --card:#1f191c; --ink:#f4eaee; --muted:#a99aa0; --line:#34292e;
    --accent:#c98aa1; --accent-ink:#1b1215; --plum:#e1a0c2; --soft:#2b2025; --ok:#7bc09b; --danger:#ef8c83;
    --hero:#0e0b0c; --shadow:0 8px 28px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#151113; --card:#1f191c; --ink:#f4eaee; --muted:#a99aa0; --line:#34292e;
  --accent:#c98aa1; --accent-ink:#1b1215; --plum:#e1a0c2; --soft:#2b2025; --ok:#7bc09b; --danger:#ef8c83;
  --hero:#0e0b0c; --shadow:0 8px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.45}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:120px;background:var(--bg)}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;margin:0;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Шапка */
.hero{background:var(--hero);color:#f6eef2;padding:26px 20px 52px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(174,112,133,.35)}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:1px solid rgba(174,112,133,.25)}
.brand{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.logo{width:84px;height:84px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(174,112,133,.6)}
.hero h1{font-size:31px;line-height:1.05;letter-spacing:.2px}
.tag{color:#d3a5b6;font-size:14px;margin-top:5px}
.addr{display:flex;gap:8px;align-items:flex-start;margin-top:18px;color:#c9bcc2;font-size:14px;position:relative;z-index:1}
.addr svg{flex:none;margin-top:2px}
.links{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;position:relative;z-index:1}
.pill{padding:8px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.22);font-size:13px;font-weight:600;text-decoration:none;color:#f6eef2}
.sheet{background:var(--bg);border-radius:24px 24px 0 0;margin-top:-28px;position:relative;padding:22px 18px 8px}
.mybtn{position:absolute;right:16px;top:-24px;height:44px;padding:0 16px 0 12px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.mybtn svg{width:20px;height:20px}
.mybtn .dot{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;display:flex;align-items:center;justify-content:center;padding:0 5px}

.rows{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;width:100%;box-shadow:var(--shadow)}
.ico{width:46px;height:46px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none;color:var(--plum)}
.ico svg{width:22px;height:22px}
.row .t{font-weight:700}
.row .s{color:var(--muted);font-size:13px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .grow{flex:1;min-width:0}
.row .chev{color:var(--muted);flex:none}
.row.done .ico{background:var(--accent);color:var(--accent-ink)}
.row.locked{opacity:.5}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
.demo{background:var(--soft);color:var(--plum);border-radius:12px;padding:8px 12px;font-size:12px;text-align:center;margin-bottom:12px}

/* Підекрани */
.stick{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px;padding:12px 14px}
.back{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.top h2{font-size:27px}
.search{margin:0 16px 10px;position:relative}
.search input{padding:11px 14px 11px 40px;border-radius:14px;font-size:15px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pad{padding:8px 16px 16px}
.grp{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:700;color:var(--plum);margin:20px 2px 8px;line-height:1.15}
.svc{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:8px}
.svc .grow{flex:1;min-width:0}
.svc .n{font-weight:600}
.svc .nt{color:var(--muted);font-size:13px;margin-top:2px}
.svc .m{color:var(--muted);font-size:12px;margin-top:4px}
.svc .p{text-align:right;white-space:nowrap;flex:none}
.svc .p b{display:block;color:var(--plum);font-size:16px}
.svc .p s{color:var(--muted);font-size:12px}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:transparent;margin-top:1px}
.svc.on{border-color:var(--accent);background:var(--soft)}
.svc.on .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk svg{width:14px;height:14px}

.mst{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.mst.on{border-color:var(--accent);background:var(--soft)}
.av{width:52px;height:52px;border-radius:50%;background:var(--hero);color:#e9c9d6;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;font-weight:700;flex:none}
.mst .n{font-weight:700}
.mst .m{color:var(--muted);font-size:13px}
.mst .grow{flex:1;min-width:0}

.dates{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.d{flex:none;width:58px;padding:10px 0;border-radius:16px;border:1px solid var(--line);background:var(--card);text-align:center}
.d .w{font-size:12px;color:var(--muted)}
.d .n{font-size:20px;font-weight:700;margin-top:2px}
.d.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.d.on .w{color:var(--bg);opacity:.75}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.slot{padding:12px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;text-align:center}
.slot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.lbl{font-size:13px;color:var(--muted);margin:14px 2px 6px;font-weight:600}

.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card .line{display:flex;justify-content:space-between;gap:14px;padding:6px 0;font-size:15px}
.card .line span:first-child{color:var(--muted);flex:none}
.card .line span:last-child{text-align:right;font-weight:600}
.card .tot{border-top:1px dashed var(--line);margin-top:6px;padding-top:10px;font-size:17px}
input,textarea{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.err{color:var(--danger);font-size:14px;margin-top:8px;min-height:20px;font-weight:600}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:linear-gradient(to top,var(--bg) 72%,transparent);padding:18px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:14px}
.bar .sum{flex:1;min-width:0}
.bar .sum b{display:block;font-size:17px}
.bar .sum small{color:var(--muted)}
.btn{display:block;width:100%;padding:16px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;text-align:center;text-decoration:none;box-shadow:var(--shadow)}
.bar .btn{width:auto;padding:16px 26px;flex:none}
.btn[disabled]{opacity:.4;box-shadow:none}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.busy{opacity:.6;pointer-events:none}

.ok{width:78px;height:78px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;margin:28px auto 14px}
.ok svg{width:38px;height:38px}
.center{text-align:center}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.note{color:var(--muted);font-size:13px;text-align:center;margin-top:10px}
.bk{margin-bottom:12px}
.bk .acts{display:flex;gap:18px;margin-top:8px}
.bk .acts a,.bk .acts button{color:var(--accent);font-weight:700;font-size:14px;text-decoration:none}
.bk .acts .x{color:var(--danger)}
.loading{padding:90px 20px;text-align:center;color:var(--muted)}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);margin:0 auto 14px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
</style>

function normalize(raw){
  const st = Object.assign({name:'Glory Beauty Centre',tagline:'',address:'',phone:'',instagram:'',price_column:'1',slot_step:'30',days_ahead:'30',min_notice_hours:'2',booking_note:''}, raw.settings||{});

    services: (raw.services||[]).map(s=>({id:String(s.id),cat:String(s.cat),group:s.group||'',name:s.name,note:s.note||'',dur:num(s.dur)||30,p1:num(s.p1),p2:num(s.p2),p3:num(s.p3),old:num(s.old)})),
    masters: (raw.masters||[]).map(m=>({id:String(m.id),name:m.name,role:m.role||'',
      cats:(String(m.cats).trim().toLowerCase()==='all')?'all':String(m.cats).split(',').map(x=>x.trim()).filter(Boolean),
      days:String(m.days||'1,2,3,4,5,6,7').split(',').map(x=>+x.trim()).filter(Boolean),
      start:toMin(m.start||'10:00'),end:toMin(m.end||'19:00')})),
    busy: (raw.busy||[]).map(b=>({date:b.date,master:String(b.master),start:num(b.start),dur:num(b.dur)}))
  };
}
const priceOf = s => { const c = Number(D.st.price_column)||1; return s['p'+c] || s.p1; };

function hash(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0); }
function isBusy(mid,date,start,d){
  if(D.busy.some(b=>b.master===mid && b.date===date && b.start<start+d && start<b.start+b.dur)) return true;
  if(DEMO){ for(let t=start;t<start+d;t+=30){ if(hash(mid+date+t)%100<22) return true; } }
  return false;
}
function mastersPool(){ return (S.master && S.master!=='any') ? [mstById(S.master)].filter(Boolean) : eligibleMasters(); }
function slotsFor(date){
  const d = totalMin(); if(!d) return [];
  const dt = parseYmd(date), dow = isoDow(dt);
  const now = new Date(); const isToday = date===ymd(now);
  const minStart = isToday ? now.getHours()*60+now.getMinutes()+(Number(D.st.min_notice_hours)||0)*60 : 0;
  const set = new Set();
  mastersPool().forEach(m=>{
    if(!m.days.includes(dow)) return;
    for(let t=m.start;t+d<=m.end;t+=step()){ if(t>=minStart && !isBusy(m.id,date,t,d)) set.add(t); }
  });
  return [...set].sort((a,b)=>a-b);
}
function pickMaster(date,start){
  const d=totalMin(); const dow=isoDow(parseYmd(date));
  const m = mastersPool().find(m=>m.days.includes(dow) && start>=m.start && start+d<=m.end && !isBusy(m.id,date,start,d));
  return m?m.id:null;
}
function days(){
  const out=[]; const base=new Date(); base.setHours(0,0,0,0);
  const pool = mastersPool(); const n = Number(D.st.days_ahead)||30;
  for(let i=0;i<n;i++){ const d=new Date(base); d.setDate(base.getDate()+i); if(pool.some(m=>m.days.includes(isoDow(d)))) out.push(d); }
  return out;
}

function evParts(b){
  const s = parseYmd(b.date); s.setHours(0,b.start,0,0);
  const e = new Date(s.getTime()+b.dur*60000);
  const f = x=>`${x.getFullYear()}${pad(x.getMonth()+1)}${pad(x.getDate())}T${pad(x.getHours())}${pad(x.getMinutes())}00`;
  return {start:f(s), end:f(e), title:`${D.st.name}: ${b.services.join(', ')}`,
    details:`Майстер: ${b.masterName}\nПослуги: ${b.services.join(', ')}\nВартість: ${money(b.price)}`+(D.st.phone?`\nТелефон: ${D.st.phone}`:''),
    loc:`${D.st.name}, ${D.st.address}`};
}
function googleUrl(b){
  const p=evParts(b);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(p.title)+'&dates='+p.start+'/'+p.end+'&details='+encodeURIComponent(p.details)+'&location='+encodeURIComponent(p.loc)+'&ctz=Europe/Kyiv';
}
function icsText(b){
  const p=evParts(b); const q=s=>s.replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  const now=new Date(); const stamp=`${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}00Z`;
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Glory Beauty Centre//Booking//UK','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:'+b.id+'@glory-booking','DTSTAMP:'+stamp,'DTSTART:'+p.start,'DTEND:'+p.end,'SUMMARY:'+q(p.title),'DESCRIPTION:'+q(p.details),'LOCATION:'+q(p.loc),
    'BEGIN:VALARM','TRIGGER:-PT60M','ACTION:DISPLAY','DESCRIPTION:Запис у салон через годину','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
}
function downloadIcs(b){
  const url = URL.createObjectURL(new Blob([icsText(b)],{type:'text/calendar;charset=utf-8'}));
  const a = document.createElement('a'); a.href=url; a.download='zapys-glory.ics';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000);
}

  document.getElementById('svclist').innerHTML = groups.length ? groups.map(g=>{
    const title = q ? [catName(g.cat),g.name].filter(Boolean).join(' · ') : g.name;
    return (title?`<div class="grp">${esc(title)}</div>`:'')+g.items.map(s=>`
      <button class="svc ${S.services.has(s.id)?'on':''}" data-svc="${esc(s.id)}">
        <span class="chk">${I.check}</span>
        <span class="grow"><div class="n">${esc(s.name)}</div>${s.note?`<div class="nt">${esc(s.note)}</div>`:''}<div class="m">${dur(s.dur)}</div></span>
        <span class="p"><b>${money(priceOf(s))}</b>${s.old?`<s>${money(s.old)}</s>`:''}</span>
      </button>`).join('');
  }).join('') : `<div class="empty">Нічого не знайдено</div>`;
  const n = S.services.size;
  document.getElementById('svcbar').innerHTML = `<div class="in">
    <div class="sum">${n?`<b>${money(totalPrice())}</b><small>Обрано: ${n} · ${dur(totalMin())}</small>`:`<small>Нічого не обрано</small>`}</div>
    <button class="btn" data-act="home" ${n?'':'disabled'}>Готово</button></div>`;
}

function mastersScreen(){
  const el = eligibleMasters(); let body='';
  if(splitNeeded()){
    body = `<div class="card"><b>Послуги потрібно розділити</b><div class="note" style="text-align:left;margin-top:6px">Обрані послуги виконують різні спеціалісти. Залиште послуги однієї категорії та запишіться окремо на інші.</div></div>`;
  } else {
    body += `<button class="mst ${S.master==='any'?'on':''}" data-mst="any"><span class="av">★</span><span class="grow"><div class="n">Будь-який спеціаліст</div><div class="m">Підберемо найближчий вільний час</div></span></button>`;
    body += el.map(m=>`<button class="mst ${S.master===m.id?'on':''}" data-mst="${esc(m.id)}"><span class="av">${esc((m.name||'?')[0])}</span><span class="grow"><div class="n">${esc(m.name)}</div>${m.role?`<div class="m">${esc(m.role)}</div>`:''}</span></button>`).join('');
  }
  return `<div class="stick">${topbar('Спеціаліст')}</div><div class="pad">${body}</div>`;
}

function datetimeScreen(){
  const ds = days();
  if(!ds.length) return `<div class="stick">${topbar('Дата та час')}</div><div class="pad"><div class="empty">Немає доступних днів. Зателефонуйте нам${D.st.phone?`: <a href="tel:${esc(D.st.phone)}">${esc(D.st.phone)}</a>`:''}.</div></div>`;
  if(!S.date || !ds.some(d=>ymd(d)===S.date)) S.date = ymd(ds[0]);
  const slots = slotsFor(S.date), d0 = parseYmd(S.date);
  const strip = ds.map(d=>`<button class="d ${ymd(d)===S.date?'on':''}" data-date="${ymd(d)}"><div class="w">${WD[d.getDay()]}</div><div class="n">${d.getDate()}</div></button>`).join('');
  const grid = slots.length ? `<div class="slots">${slots.map(t=>`<button class="slot ${S.time===t?'on':''}" data-time="${t}">${hm(t)}</button>`).join('')}</div>`
    : `<div class="empty">На цей день вільного часу немає.<br>Оберіть іншу дату.</div>`;
  return `<div class="stick">${topbar('Дата та час')}</div>
    <div class="pad"><div class="lbl">${MONN[d0.getMonth()]} ${d0.getFullYear()}</div>
      <div class="dates">${strip}</div>
      <div class="lbl">Вільний час · потрібно ${dur(totalMin())}</div>${grid}</div>
    <div class="bar"><div class="in">
      <div class="sum">${S.time!=null?`<b>${longDate(d0)}</b><small>${hm(S.time)}–${hm(S.time+totalMin())}</small>`:`<small>Оберіть час</small>`}</div>
      <button class="btn" data-act="home" ${S.time!=null?'':'disabled'}>Готово</button></div></div>`;
}

function summaryCard(){
  const d = parseYmd(S.date); const mid = pickMaster(S.date,S.time); const m = mid?mstById(mid):null;
  return `<div class="card">
    <div class="line"><span>Послуги</span><span>${chosen().map(s=>esc(s.name)).join('<br>')}</span></div>
    <div class="line"><span>Спеціаліст</span><span>${m?esc(m.name):'—'}</span></div>
    <div class="line"><span>Дата</span><span>${longDate(d)}</span></div>
    <div class="line"><span>Час</span><span>${hm(S.time)}–${hm(S.time+totalMin())}</span></div>
    <div class="line tot"><span>Орієнтовно</span><span>${money(totalPrice())}</span></div>
  </div>`;
}
function contactScreen(){
  return `<div class="stick">${topbar('Підтвердження')}</div><div class="pad">
    ${summaryCard()}
    <div class="lbl">Ваше ім'я</div>
    <input id="f-name" autocomplete="name" placeholder="Як до вас звертатись" value="${esc(S.name)}">
    <div class="lbl">Телефон</div>
    <input id="f-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="0XX XXX XX XX" value="${esc(S.phone)}">
    <div class="lbl">Коментар (необов'язково)</div>
    <textarea id="f-com" rows="2" placeholder="Побажання до запису">${esc(S.comment)}</textarea>
    <input class="hp" id="f-hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div class="err" id="err" role="alert"></div>
  </div>
  <div class="bar"><div class="in"><button class="btn" id="confirm">Підтвердити запис</button></div></div>`;
}
function doneScreen(){
  const b = S.last;
  return `<div class="pad center">
    <div class="ok">${I.check}</div>
    <h1 style="font-size:36px">Ви записані</h1>
    <div class="note" style="margin:8px 0 18px">${esc(D.st.booking_note||'Чекаємо на вас!')}</div>
    <div class="card" style="text-align:left">
      <div class="line"><span>Послуги</span><span>${b.services.map(esc).join('<br>')}</span></div>
      <div class="line"><span>Спеціаліст</span><span>${esc(b.masterName)}</span></div>
      <div class="line"><span>Коли</span><span>${longDate(parseYmd(b.date))}<br>${hm(b.start)}–${hm(b.start+b.dur)}</span></div>
      <div class="line"><span>Де</span><span>${esc(D.st.address)}</span></div>
      <div class="line tot"><span>Орієнтовно</span><span>${money(b.price)}</span></div>
    </div>
    <div class="stack">
      <a class="btn" href="${googleUrl(b)}" target="_blank" rel="noopener">Додати в Google Календар</a>
      <button class="btn alt" id="ics">Додати в Apple / Outlook (.ics)</button>
      <button class="btn alt" data-act="reset">Готово</button>
    </div>
  </div>`;
}
function myScreen(){
  const list = mine.slice().sort((a,b)=>(b.date+hm(b.start)).localeCompare(a.date+hm(a.start)));
  const body = list.length ? list.map(b=>{
    const past = parseYmd(b.date).getTime()+b.start*60000 < Date.now(), cancelled = b.status==='cancelled';
    return `<div class="card bk" style="${past||cancelled?'opacity:.6':''}">
      <div class="line"><span>Коли</span><span>${longDate(parseYmd(b.date))}, ${hm(b.start)}</span></div>
      <div class="line"><span>Послуги</span><span>${b.services.map(esc).join('<br>')}</span></div>
      <div class="line"><span>Спеціаліст</span><span>${esc(b.masterName)}</span></div>
      ${cancelled?`<div class="note" style="text-align:left">Скасовано</div>`:past?'':`<div class="acts"><a href="${googleUrl(b)}" target="_blank" rel="noopener">У календар</a><button class="x" data-cancel="${esc(b.id)}">Скасувати</button></div>`}
    </div>`;
  }).join('') : `<div class="empty">Записів поки немає</div>`;
  return `<div class="stick">${topbar('Мої записи')}</div><div class="pad">${body}<div class="err" id="err"></div></div>`;
}

/* ===================== Рендер ===================== */
function render(){
  if(!D){ return; }
  const map = {home, services:servicesScreen, masters:mastersScreen, datetime:datetimeScreen, contact:contactScreen, done:doneScreen, my:myScreen};
  $app.innerHTML = map[S.screen]();
  if(S.screen==='services'){ updateServices(); document.getElementById('q').addEventListener('input',e=>{ S.q=e.target.value; updateServices(); }); }
  if(S.screen==='contact'){
    document.getElementById('confirm').onclick = submit;
    document.getElementById('f-name').addEventListener('input',e=>S.name=e.target.value);
    document.getElementById('f-phone').addEventListener('input',e=>S.phone=e.target.value);
    document.getElementById('f-com').addEventListener('input',e=>S.comment=e.target.value);
  }
  if(S.screen==='done'){ document.getElementById('ics').onclick = ()=>downloadIcs(S.last); }
}

function normPhone(v){
  let d = String(v).replace(/\D/g,'');
  if(d.length===10 && d[0]==='0') d='38'+d;
  if(d.length===12 && d.startsWith('380')) return '+'+d;
  return null;
}

async function submit(){
  const err = document.getElementById('err'), btn = document.getElementById('confirm');
  const name = S.name.trim(), phone = normPhone(S.phone);
  if(name.length<2){ err.textContent="Вкажіть ім'я"; return; }
  if(!phone){ err.textContent='Вкажіть номер у форматі 0XX XXX XX XX'; return; }
  const mid = pickMaster(S.date,S.time);
  if(!mid){ err.textContent='Цей час щойно зайняли. Оберіть інший.'; return; }
  const hp = document.getElementById('f-hp').value;
  const payload = {action:'book', date:S.date, start:S.time, master:mid, services:[...S.services], name, phone, comment:S.comment.trim(), hp};
  btn.classList.add('busy'); btn.textContent='Надсилаємо…'; err.textContent='';
  let b;
  if(DEMO){
    b = {id:'b'+Date.now(), date:S.date, start:S.time, dur:totalMin(), price:totalPrice(), services:chosen().map(s=>s.name), masterId:mid, masterName:mstById(mid).name};
  } else {
    try{
      const r = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
      const j = await r.json();
      if(!j.ok){
        btn.classList.remove('busy'); btn.textContent='Підтвердити запис';
        if(j.error==='busy'){ await refresh(); S.time=null; err.textContent='Цей час щойно зайняли. Оберіть інший.'; setTimeout(()=>go('datetime'),1400); return; }
        err.textContent = j.message || 'Не вдалося записатись. Спробуйте ще раз або зателефонуйте нам.'; return;
      }
      b = j.booking;
    }catch(e){
      btn.classList.remove('busy'); btn.textContent='Підтвердити запис';
      err.textContent='Немає зв\'язку із сервером. Перевірте інтернет і спробуйте ще раз'+(D.st.phone?' або зателефонуйте: '+D.st.phone:'')+'.'; return;
    }
  }
  b.status='active'; b.phone=phone;
  mine.push(b); LS.set('glory_bookings',mine);
  D.busy.push({date:b.date,master:String(b.masterId),start:b.start,dur:b.dur});
  S.last=b; S.name=S.name; go('done');
}
async function cancelBooking(id){
  const b = mine.find(x=>x.id===id); if(!b) return;
  if(!confirm('Скасувати запис?')) return;
  if(!DEMO){
    try{
      const r = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'cancel',id:b.id,phone:b.phone})});
      const j = await r.json(); if(!j.ok) throw 0;
    }catch(e){ const el=document.getElementById('err'); if(el) el.textContent='Не вдалося скасувати. Зателефонуйте нам'+(D.st.phone?': '+D.st.phone:'')+'.'; return; }
  }
  b.status='cancelled'; LS.set('glory_bookings',mine);
  D.busy = D.busy.filter(x=>!(x.date===b.date && x.master===String(b.masterId) && x.start===b.start));
  render();
}
function resetFlow(){ S.services=new Set(); S.master=null; S.date=null; S.time=null; S.comment=''; S.q=''; go('home'); }

document.addEventListener('click',e=>{
  const t = e.target.closest('[data-act],[data-svc],[data-cat],[data-mst],[data-date],[data-time],[data-cancel]');
  if(!t || !D) return;
  if(t.dataset.svc){
    const id=t.dataset.svc; S.services.has(id)?S.services.delete(id):S.services.add(id);
    if(S.master && S.master!=='any' && !eligibleMasters().some(m=>m.id===S.master)) S.master=null;
    S.time=null; updateServices(); return;
  }
  if(t.dataset.cat){ S.cat=t.dataset.cat; S.q=''; const qi=document.getElementById('q'); if(qi) qi.value=''; updateServices(); window.scrollTo(0,0); return; }
  if(t.dataset.mst){ S.master=t.dataset.mst; S.time=null; go('home'); return; }
  if(t.dataset.date){ S.date=t.dataset.date; S.time=null; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(t.dataset.time){ S.time=Number(t.dataset.time); const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(t.dataset.cancel){ cancelBooking(t.dataset.cancel); return; }
  const a=t.dataset.act; if(t.disabled) return;
  if(a==='reset') return resetFlow();
  if(a==='masters' && !S.services.size) return;
  if(a==='datetime' && !S.master) return;
  go(a);
});

(async function init(){
  try{ await loadData(); S._booted=true; render(); }
  catch(e){
    $app.innerHTML = `<div class="loading">Не вдалося завантажити дані.<br><br><button class="btn" onclick="location.reload()">Спробувати ще раз</button></div>`;
  }
})();
</script>
</body>
